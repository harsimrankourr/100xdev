<html>
<script>
    function populateDive() {
        const a = document.getElementById("firstNumber").value;
        const b = document.getElementById("secondNumber").value;
        fetch("https://sum-server.100xdevs.com/sum?a=" + a + "&b=" + b)
            .then(function (response) {

                response.text()
                    .then(function (ans) {
                        document.getElementById("finalSum").innerHTML = ans;
                    })
            })
    }

    //OR

    async function populateDiv2() {
        const a = document.getElementById("firstNumber").value;
        const b = document.getElementById("secondNumber").value;

        const response = await fetch("https://sum-server.100xdevs.com/sum?a=" + a + "&b=" + b)
        const ans = await response.text();
        // How do we render something on frontend using DOM 
        //Like this
        document.getElementById("finalSum").innerHTML = ans;
    }
</script>

<body>
    <input onchange="populateDiv()" id="firstNumber" type="text" placeholder="First number"></input>
    <br></br>
    <input onchange="populateDiv()" id="secondNumber" type="text" placeholder="Second number"></input>
    <br></br>
    <button onclick="populateDiv()">Calculate sum</button>
    <br></br>

    <div id="finalSum"></div>
</body>

</html>
